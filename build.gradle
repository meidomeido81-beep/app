plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '1.8.0'
}

android {
    namespace 'com.project.monitor'
    compileSdk 33

    defaultConfig {
        applicationId 'com.project.monitor'
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
}
